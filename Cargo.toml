[workspace]
members = ["rustex", "tex-glyphs", "tex_engine"]
resolver = "2"

[workspace.lints.clippy]
#enum_glob_use = "deny"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"

#[profile.dev]
#opt-level = 2
#lto = "fat"
#debug = 1

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
strip = false

[workspace.dependencies]
tex_engine = { path = "tex_engine", version = "0.1.2" }
tex-glyphs = { path = "tex-glyphs", version = "0.1.2" }
rustex = { path = "rustex" }
pdfium-render = { version = "0.9", features = [
    "image_025",
    "pdfium_7350",
    "thread_safe"
], default-features=false }
